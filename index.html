<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitFlow | Smart Training</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <nav class="nav-container">
            <strong class="logo">Fit<span>Flow</span></strong>
            <ul class="nav-menu">
                <li><a href="#" class="nav-link active" data-page="exercises">Вправи</a></li>
                <li><a href="#" class="nav-link" data-page="programs">Мої програми</a></li>
                <li><a href="#" class="nav-link" data-page="profile">Профіль</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-wrapper">
        <section id="exercises-page" class="page active">
            <header class="page-intro">
                <h1>Каталог тренувань</h1>
                <p>Оберіть тип навантаження:</p>
                <nav class="filter-nav">
                    <button class="filter-btn active" data-type="all">Всі</button>
                    <button class="filter-btn" data-type="силова">Силові</button>
                    <button class="filter-btn" data-type="кардіо">Кардіо</button>
                </nav>
            </header>

            <section id="exercise-grid" class="cards-layout">
                </section>
        </section>

        <section id="programs-page" class="page">
            <h1>Ваш персональний план</h1>
            <section id="my-plan-grid" class="cards-layout">
                <p class="empty-info">Ви ще не обрали жодної вправи.</p>
            </section>
        </section>

        <section id="profile-page" class="page">
            <article class="form-wrapper">
                <form id="regForm" novalidate>
                    <fieldset>
                        <legend><h2>Реєстрація атлета</h2></legend>

                        <label for="name">Ваше ім'я (мін. 3 символи):</label>
                        <input type="text" id="name" name="name" required minlength="3" placeholder="Олександр">
                        <span class="error-text">Ім'я занадто коротке</span>

                        <label for="email">Електронна пошта:</label>
                        <input type="email" id="email" name="email" required placeholder="fitness@mail.com">
                        <span class="error-text">Введіть коректний email</span>

                        <button type="submit" class="action-btn">Створити профіль</button>
                    </fieldset>
                </form>
            </article>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
